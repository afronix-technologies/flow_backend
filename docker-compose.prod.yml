services:
  # Database Service
  postgres:
    image: postgres:15
    container_name: flow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - '${DATABASE_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - afronix-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: flow-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - afronix-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Auth Service
  auth-service:
    image: ${DOCKER_REGISTRY}/flow-auth-service:${IMAGE_TAG:-production-latest}
    container_name: auth-service
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - AUTH_SERVICE_PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION:-7d}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NOTIFICATION_SERVICE_URL=http://notification-service:3002
      - API_SERVICE_URL=http://api:3000
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_CALLBACK_URL=${MICROSOFT_CALLBACK_URL}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
      - FRONTEND_URL=${FRONTEND_URL}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-5}
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - afronix-network
    volumes:
      - /var/log/applications/flow:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Notification Service
  notification-service:
    image: ${DOCKER_REGISTRY}/flow-notification-service:${IMAGE_TAG:-production-latest}
    container_name: notification-service
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NOTIFICATION_SERVICE_PORT=3002
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - afronix-network
    volumes:
      - /var/log/applications/flow:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Job Service
  job-service:
    image: ${DOCKER_REGISTRY}/flow-job-service:${IMAGE_TAG:-production-latest}
    container_name: job-service
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - JOB_SERVICE_PORT=3003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afronix-network
    volumes:
      - /var/log/applications/flow:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3003/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # File Service
  file-service:
    image: ${DOCKER_REGISTRY}/flow-file-service:${IMAGE_TAG:-production-latest}
    container_name: file-service
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - FILE_SERVICE_PORT=3004
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - UPLOAD_DIR=/srv/data/uploads
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-524288000}
      - BASE_URL=https://${DOMAIN}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - afronix-network
    volumes:
      - /srv/data/uploads:/srv/data/uploads
      - /var/log/applications/flow:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3004/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # API Service (core product — projects, tasks, etc.)
  api:
    image: ${DOCKER_REGISTRY}/flow-api:${IMAGE_TAG:-production-latest}
    container_name: api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - API_PORT=3000
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-7d}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - afronix-network
    volumes:
      - /var/log/applications/flow:/app/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Settings Service
  settings-service:
    image: ${DOCKER_REGISTRY}/flow-settings-service:${IMAGE_TAG:-production-latest}
    container_name: settings-service
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - SETTINGS_SERVICE_PORT=3005
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CORS_ORIGINS=${CORS_ORIGINS}
      - FLUTTERWAVE_SECRET_KEY=${FLUTTERWAVE_SECRET_KEY}
      - PAYSTACK_SECRET_KEY=${PAYSTACK_SECRET_KEY}
      - BILLING_CALLBACK_URL=${BILLING_CALLBACK_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - afronix-network
    volumes:
      - /var/log/applications/flow:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3005/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Admin Panel
  admin-service:
    image: ${DOCKER_REGISTRY}/flow-admin-service:${IMAGE_TAG:-production-latest}
    container_name: admin-service
    restart: unless-stopped
    ports:
      - '3006:3006'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - ADMIN_SERVICE_PORT=3006
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - ADMIN_COOKIE_SECRET=${ADMIN_COOKIE_SECRET}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - afronix-network
    volumes:
      - /var/log/applications/flow:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Super Admin Seeder — runs once on deploy, exits when done
  seeder:
    image: ${DOCKER_REGISTRY}/flow-auth-service:${IMAGE_TAG:-production-latest}
    container_name: flow-seeder
    restart: 'no'
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - SUPERADMIN_EMAIL=${SUPERADMIN_EMAIL}
      - SUPERADMIN_PASSWORD=${SUPERADMIN_PASSWORD}
      - SUPERADMIN_FIRST_NAME=${SUPERADMIN_FIRST_NAME:-Afronix}
      - SUPERADMIN_LAST_NAME=${SUPERADMIN_LAST_NAME:-Admin}
    depends_on:
      postgres:
        condition: service_healthy
    command: npx ts-node -r tsconfig-paths/register scripts/seed-superadmin.ts
    networks:
      - afronix-network
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '1'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: flow-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/ssl:/etc/nginx/ssl
      - certbot-data:/var/www/certbot:ro
    environment:
      - DOMAIN=${DOMAIN}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    depends_on:
      - auth-service
      - notification-service
      - job-service
      - file-service
      - settings-service
      - admin-service
      - api
    networks:
      - afronix-network
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Certbot for SSL Certificate Management
  certbot:
    image: certbot/certbot
    container_name: flow-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-data:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - afronix-network

networks:
  afronix-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot-data:
    driver: local
