events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:3001;
    }

    upstream notification_service {
        server notification-service:3002;
    }

    upstream job_service {
        server job-service:3003;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name ${DOMAIN} *.${DOMAIN};

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server - Wildcard subdomain support
    server {
        listen 443 ssl http2;
        server_name ${DOMAIN} *.${DOMAIN};

        # SSL certificates (wildcard)
        ssl_certificate /etc/nginx/ssl/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/${DOMAIN}/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1000;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Client body size limit
        client_max_body_size 10M;

        # Proxy settings - Optimized for Swagger
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Increase buffers for large Swagger responses
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Auth Service routes
        location /api/v1/auth {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
        }

        # Users routes
        location /api/v1/users {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
        }

        # Organizations routes
        location /api/v1/organizations {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
        }

        # Invitations routes
        location /api/v1/invitations {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
        }

        # OAuth routes
        location /api/v1/oauth {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://auth_service;
        }

        # Health check (no rate limit)
        location /api/v1/health {
            proxy_pass http://auth_service;
        }

        # Notification Service routes
        location /api/v1/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_service;
        }

        # API Documentation - Order matters! Specific routes BEFORE general routes
        
        # Job Service Docs (most specific first)
        location /api/docs/jobs {
            proxy_pass http://job_service;
        }
        
        # Notification Service Docs
        location /api/docs/notifications {
            proxy_pass http://notification_service;
        }
        
        # Auth Service Docs (general catch-all for /api/docs)
        location /api/docs {
            proxy_pass http://auth_service;
        }

        # Default fallback
        location / {
            return 404 '{"error": "Not Found", "message": "The requested resource does not exist"}';
            add_header Content-Type application/json;
        }
    }
}