services:
  # Database Service
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - afronix-network

  # Redis Service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - afronix-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOMAIN=${DOMAIN}
      - NOTIFICATION_SERVICE_URL=http://notification-service:3002
      # OAuth Config
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_CALLBACK_URL=${MICROSOFT_CALLBACK_URL}
      - MICROSOFT_TENANT_ID=${MICROSOFT_TENANT_ID}
      - FRONTEND_URL=${FRONTEND_URL}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-5}
      - THROTTLE_TTL=${THROTTLE_TTL:-60000}
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npx nest start auth-service --watch
    networks:
      - afronix-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - NOTIFICATION_SERVICE_PORT=3002
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - afronix-network

  # Job Service
  job-service:
    build:
      context: .
      dockerfile: apps/job-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - JOB_SERVICE_PORT=3003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - afronix-network

  # File Service
  file-service:
    build:
      context: .
      dockerfile: apps/file-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - FILE_SERVICE_PORT=3004
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=524288000
      - BASE_URL=http://localhost:3004
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - ./uploads:/app/uploads
    command: npx nest start file-service --watch
    networks:
      - afronix-network

  # Settings Service
  settings-service:
    build:
      context: .
      dockerfile: apps/settings-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - SETTINGS_SERVICE_PORT=3005
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_NAME=${DATABASE_NAME}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npx nest start settings-service --watch
    networks:
      - afronix-network

networks:
  afronix-network:
    driver: bridge

volumes:
  postgres_data:
