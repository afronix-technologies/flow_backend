events {
    worker_connections 1024;
}

http {
    # Increase body size for offline sync uploads (e.g. photos)
    client_max_body_size 50M;

    upstream api_backend {
        # Docker DNS resolves 'app' to all container IPs
        server app:3000;
        # keepalive 32; # Keep connections open for efficiency
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _; 

        # For now, just forward. In prod, this should redirect to 443.
        # return 301 https://$host$request_uri;

        location / {
             proxy_pass http://api_backend;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check Endpoint for Load Balancer
        location /health {
            access_log off;
            return 200 "OK";
        }
    }

    # HTTPS Block (Placeholder - Needs Certbot)
    # server {
    #     listen 443 ssl http2;
    #     server_name example.com;
    #     ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    #     ...
    # }
}
