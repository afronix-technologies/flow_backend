name: Continuous Integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Check code formatting (Prettier)
        run: npm run format -- --check
      
      - name: Run linter (ESLint)
        run: npm run lint

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Check for outdated dependencies
        run: npm outdated || true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm run test
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test
      
      - name: Generate coverage report
        if: always()
        run: npm run test:cov || true
      
      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    
    strategy:
      matrix:
        service: [auth-service, notification-service, job-service]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build ${{ matrix.service }}
        run: npm run build
      
      - name: Verify build artifacts
        run: |
          if [ ! -d "dist/apps/${{ matrix.service }}" ]; then
            echo "Build failed for ${{ matrix.service }}"
            exit 1
          fi
          echo "✅ Build successful for ${{ matrix.service }}"

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build auth-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth-service/Dockerfile
          push: false
          tags: afronix/flow-auth-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build notification-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/notification-service/Dockerfile
          push: false
          tags: afronix/flow-notification-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build job-service image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/job-service/Dockerfile
          push: false
          tags: afronix/flow-job-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, test, build-verification, docker-build]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          echo "🎉 All CI checks completed!"
          echo "✅ Code quality: ${{ needs.code-quality.result }}"
          echo "✅ Security scan: ${{ needs.security-scan.result }}"
          echo "✅ Tests: ${{ needs.test.result }}"
          echo "✅ Build verification: ${{ needs.build-verification.result }}"
          echo "✅ Docker build: ${{ needs.docker-build.result }}"
          
          if [[ "${{ needs.code-quality.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build-verification.result }}" != "success" ]]; then
            echo "❌ CI failed. Please fix the issues above."
            exit 1
          fi
          
          echo "✅ All critical checks passed!"
