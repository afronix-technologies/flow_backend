name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ─── Job 0: Single version tag shared across ALL matrix builds ───
  generate-version:
    name: Generate Version Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Generate version
        id: version
        run: |
          echo "version=staging-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "🏷️ Staging version: staging-${GITHUB_SHA::7}"

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: generate-version
    
    strategy:
      matrix:
        service:
          - name: auth-service
            port: 3001
          - name: notification-service
            port: 3002
          - name: job-service
            port: 3003
          - name: file-service
            port: 3004
          - name: settings-service
            port: 3005
          - name: admin-service
            port: 3006
          - name: api
            port: 3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/flow-${{ matrix.service.name }}
          tags: |
            type=raw,value=staging-${{ github.sha }}
            type=raw,value=staging-latest
            type=ref,event=branch
      
      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }},ignore-error=true
          build-args: |
            NODE_ENV=staging
            SERVICE_PORT=${{ matrix.service.port }}
      
      - name: Image digest
        run: |
          echo "✅ Pushed: flow-${{ matrix.service.name }}"
          echo "🏷️ Tag: staging-${{ github.sha }}"

  deploy-to-vps:
    name: Deploy to VPS Staging
    runs-on: ubuntu-latest
    needs: [generate-version, build-and-push]
    # environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deployment_key
          chmod 600 ~/.ssh/deployment_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Copy deployment files to VPS
        run: |
          scp -i ~/.ssh/deployment_key \
            -r scripts nginx docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/flow-staging/
      
      - name: Create environment file on VPS
        run: |
          ssh -i ~/.ssh/deployment_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cat > /opt/flow-staging/.env.staging << 'EOF'
          # Application
          NODE_ENV=staging
          API_PREFIX=api
          API_VERSION=v1
          
          # Database
          DATABASE_HOST=postgres
          DATABASE_PORT=5432
          DATABASE_USER=${{ secrets.STAGING_DATABASE_USER }}
          DATABASE_PASSWORD=${{ secrets.STAGING_DATABASE_PASSWORD }}
          DATABASE_NAME=flow_staging
          DATABASE_SSL=false

          # Frontend
          FRONTEND_URL=https://test-flow.afronix.com
          
          # Redis
          REDIS_HOST=redis
          REDIS_PORT=6379
          
          # Authentication
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRATION=15m
          JWT_REFRESH_SECRET=${{ secrets.STAGING_JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRATION=7d
          
          # Services
          AUTH_SERVICE_PORT=3001
          NOTIFICATION_SERVICE_PORT=3002
          JOB_SERVICE_PORT=3003
          FILE_SERVICE_PORT=3004
          SETTINGS_SERVICE_PORT=3005
          API_PORT=3000
          API_SERVICE_URL=http://api:3000
          
          # SMTP
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}

          # Google OAuth
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL=https://devflow.afronix.com:8443/api/v1/auth/google/callback

          # Microsoft OAuth
          MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET=${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_CALLBACK_URL=https://devflow.afronix.com:8443/api/v1/auth/microsoft/callback
          MICROSOFT_TENANT_ID=${{ secrets.MICROSOFT_TENANT_ID }}

          # Rate Limit 
          THROTTLE_TTL=60000
          THROTTLE_LIMIT=10000
          
          # File Storage
          UPLOAD_DIR=/srv/data/uploads
          MAX_FILE_SIZE=524288000
          
          # CORS - Updated for wildcard subdomains
          CORS_ORIGINS=https://*.devflow.afronix.com,https://devflow.afronix.com,https://devflow.afronix.com:8443,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:4200,http://localhost:4201,https://flowwithafronix.vercel.app,https://test-flow.afronix.com,https://*.test-flow.afronix.com,http://johntech.localhost:4201,http://johntech.localhost:4200
          
          # Admin Panel
          ADMIN_SERVICE_PORT=3006
          ADMIN_COOKIE_SECRET=${{ secrets.ADMIN_COOKIE_SECRET }}
          ADMIN_SESSION_SECRET=${{ secrets.ADMIN_SESSION_SECRET }}
          SUPERADMIN_EMAIL=${{ secrets.SUPERADMIN_EMAIL }}
          SUPERADMIN_PASSWORD=${{ secrets.SUPERADMIN_PASSWORD }}
          SUPERADMIN_FIRST_NAME=Afronix
          SUPERADMIN_LAST_NAME=Admin

          # Payment Providers
          FLUTTERWAVE_SECRET_KEY=${{ secrets.FLUTTERWAVE_SECRET_KEY }}
          PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
          BILLING_CALLBACK_URL=https://test-flow.afronix.com/billing/callback

          # Docker
          DOCKER_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG=staging-latest
          
          # Nginx - Updated for wildcard subdomains
          DOMAIN=devflow.afronix.com
          BASE_URL=https://devflow.afronix.com:8443
          NGINX_HTTP_PORT=8080
          NGINX_HTTPS_PORT=8443
          EOF"
      
      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/deployment_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e
          cd /opt/flow-staging
          
          echo "📦 Pulling latest Docker images..."
          export DOCKER_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
          export IMAGE_TAG=staging-latest
          
          echo "🛑 Freeing up ports..."

          # Stop and remove all containers
          docker stop $(docker ps -aq) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true

          # Remove only this project's network (scoped, not global prune)
          docker network rm flow-staging_afronix-network 2>/dev/null || true

          # Kill system nginx and free ports
          sudo killall -9 nginx 2>/dev/null || true
          sudo fuser -k -9 80/tcp 2>/dev/null || true
          sudo fuser -k -9 443/tcp 2>/dev/null || true

          # Wait for ports to free
          sleep 5

          echo "✅ Ports cleared"

          docker compose --env-file .env.staging -f docker-compose.prod.yml pull

          echo "🔄 Stopping old containers..."
          docker compose --env-file .env.staging -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true

          echo "🚀 Starting new containers..."
          docker compose --env-file .env.staging -f docker-compose.prod.yml up -d
          
          echo "✅ Deployment complete!"
          docker ps
          ENDSSH
      
      - name: Reload Nginx (Wildcard SSL)
        run: |
          ssh -i ~/.ssh/deployment_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          cd /opt/flow-staging
          
          # We assume Wildcard SSL is manually set up
          echo "🔄 Reloading Nginx..."
          docker compose --env-file .env.staging -f docker-compose.prod.yml restart nginx
          
          ENDSSH
      
      - name: Health check
        run: |
          ssh -i ~/.ssh/deployment_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/flow-staging && bash scripts/health-check.sh"
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deployment_key
      
      - name: Deployment summary
        run: |
          echo "🎉 Staging deployment successful!"
          echo "📍 Wildcard URL: https://*.devflow.afronix.com"
          echo "📍 Base URL: https://devflow.afronix.com"
          echo "🏷️ Image tag: staging-${{ github.sha }}"
          echo "📝 Commit: ${{ github.event.head_commit.message }}"

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy-to-vps]
    if: always()
    
    steps:
      - name: Deployment status
        run: |
          if [[ "${{ needs.deploy-to-vps.result }}" == "success" ]]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
            exit 1
          fi