name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    
    strategy:
      matrix:
        service:
          - name: auth-service
            port: 3001
          - name: notification-service
            port: 3002
          - name: job-service
            port: 3003
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/flow-${{ matrix.service.name }}
          tags: |
            type=raw,value=staging-{{sha}}
            type=raw,value=staging-latest
            type=ref,event=branch
      
      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service.name }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=staging
            SERVICE_PORT=${{ matrix.service.port }}
      
      - name: Image digest
        run: |
          echo "Pushed image digest: ${{ steps.meta.outputs.digest }}"

  deploy-to-vps:
    name: Deploy to VPS Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    # environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deployment_key
          chmod 600 ~/.ssh/deployment_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Copy deployment files to VPS
        run: |
          scp -i ~/.ssh/deployment_key \
            -r scripts nginx docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/flow-staging/
      
      - name: Create environment file on VPS
        run: |
          ssh -i ~/.ssh/deployment_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cat > /opt/flow-staging/.env.staging << 'EOF'
          # Application
          NODE_ENV=staging
          API_PREFIX=api
          API_VERSION=v1
          
          # Database
          DATABASE_HOST=postgres
          DATABASE_PORT=5432
          DATABASE_USER=${{ secrets.STAGING_DATABASE_USER }}
          DATABASE_PASSWORD=${{ secrets.STAGING_DATABASE_PASSWORD }}
          DATABASE_NAME=flow_staging
          DATABASE_SSL=false
          
          # Redis
          REDIS_HOST=redis
          REDIS_PORT=6379
          
          # Authentication
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          JWT_EXPIRATION=15m
          JWT_REFRESH_SECRET=${{ secrets.STAGING_JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRATION=7d
          
          # Services
          AUTH_SERVICE_PORT=3001
          NOTIFICATION_SERVICE_PORT=3002
          JOB_SERVICE_PORT=3003
          
          # SMTP
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}

          # Google OAuth
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}

          # Microsoft OAuth
          MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET=${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_CALLBACK_URL=${{ secrets.MICROSOFT_CALLBACK_URL }}
          MICROSOFT_TENANT_ID=${{ secrets.MICROSOFT_TENANT_ID }}
          
          # CORS - Updated for wildcard subdomains
          CORS_ORIGINS=https://*.staging.flow.afronix.com,https://staging.flow.afronix.com,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:4200,http://localhost:4201
          
          # Docker
          DOCKER_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG=staging-latest
          
          # Nginx - Updated for wildcard subdomains
          DOMAIN=staging.flow.afronix.com
          NGINX_HTTP_PORT=8080
          NGINX_HTTPS_PORT=8443
          EOF"
      
      - name: Deploy to staging
        run: |
          ssh -i ~/.ssh/deployment_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          set -e
          cd /opt/flow-staging
          
          echo "📦 Pulling latest Docker images..."
          export DOCKER_REGISTRY=${{ secrets.DOCKERHUB_USERNAME }}
          export IMAGE_TAG=staging-latest
          
          echo "🛑 Freeing up ports..."

          # Nuclear option - stop everything
          docker stop $(docker ps -aq) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true

          # Kill system nginx
          sudo killall -9 nginx 2>/dev/null || true
          sudo fuser -k -9 80/tcp 2>/dev/null || true  
          sudo fuser -k -9 443/tcp 2>/dev/null || true

          # Wait for ports to free
          sleep 5

          echo "✅ Ports cleared"
          
          docker compose -f docker-compose.prod.yml pull
          
          echo "🔄 Stopping old containers..."
          docker compose -f docker-compose.prod.yml down || true
          
          echo "🚀 Starting new containers..."
          docker compose --env-file .env.staging -f docker-compose.prod.yml up -d
          
          echo "⏳ Waiting for services to be healthy..."
          sleep 10
          
          echo "✅ Deployment complete!"
          docker ps
          ENDSSH
      
      - name: Reload Nginx (Wildcard SSL)
        run: |
          ssh -i ~/.ssh/deployment_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          cd /opt/flow-staging
          
          # We assume Wildcard SSL is manually set up
          echo "🔄 Reloading Nginx..."
          docker compose --env-file .env.staging -f docker-compose.prod.yml restart nginx
          
          ENDSSH
      
      - name: Health check
        run: |
          sleep 15
          ssh -i ~/.ssh/deployment_key \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/flow-staging && bash scripts/health-check.sh"
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deployment_key
      
      - name: Deployment summary
        run: |
          echo "🎉 Staging deployment successful!"
          echo "📍 Wildcard URL: https://*.staging.flow.afronix.com"
          echo "📍 Base URL: https://staging.flow.afronix.com"
          echo "🏷️ Image tag: staging-${{ github.sha }}"
          echo "📝 Commit: ${{ github.event.head_commit.message }}"

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy-to-vps]
    if: always()
    
    steps:
      - name: Deployment status
        run: |
          if [[ "${{ needs.deploy-to-vps.result }}" == "success" ]]; then
            echo "✅ Staging deployment successful"
          else
            echo "❌ Staging deployment failed"
            exit 1
          fi